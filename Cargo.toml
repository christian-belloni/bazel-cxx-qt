[workspace]
members = ["."]
resolver = "3"

[package]
name = "bazel-cxx-qt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cxx-qt-build = "0.10"
qt-build-utils = "0.10"
pathx = "0.1.0"
dircpy = "0.3.21"


[dev-dependencies]
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
