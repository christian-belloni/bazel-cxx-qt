[workspace]
members = [".", "tests/basic"]
resolver = "3"

[package]
name = "cxx-qt-bazel"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cxx-qt-build = "0.10"
qt-build-utils = "0.10"
pathx = "0.1.0"


[dev-dependencies]
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
qtbridge = "0.3"

[patch.crates-io]
cxx-qt-build = { git = "https://github.com/christian-belloni/cxx-qt.git" }
cxx-qt-gen = { git = "https://github.com/christian-belloni/cxx-qt.git" }
qt-build-utils = { git = "https://github.com/christian-belloni/cxx-qt.git" }
